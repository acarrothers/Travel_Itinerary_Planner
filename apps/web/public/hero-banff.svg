<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised turquoise mountain lake framed by peaks and autumn larches">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE8F7"/>
      <stop offset="0.6" stop-color="#EFE7F6"/>
      <stop offset="1" stop-color="#F6EFE0"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD8CB"/>
      <stop offset="0.5" stop-color="#39B4B8"/>
      <stop offset="1" stop-color="#1E8FA0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.22" r="0.35">
      <stop offset="0" stop-color="#FCD400" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FCD400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- far range -->
  <path d="M0 430 L180 300 L340 400 L520 250 L700 400 L880 270 L1090 410 L1280 290 L1450 400 L1600 330 L1600 520 L0 520 Z" fill="#C9BBE0"/>
  <!-- mid range with snow -->
  <path d="M0 470 L240 300 L430 470 L640 250 L560 470 Z" fill="#8E79BE"/>
  <path d="M560 470 L640 250 L840 470 Z" fill="#7A63AF"/>
  <path d="M820 470 L1040 260 L1260 470 Z" fill="#8E79BE"/>
  <path d="M1180 470 L1380 280 L1600 470 L1600 470 Z" fill="#7A63AF"/>
  <!-- snow caps -->
  <path d="M600 320 L640 250 L688 320 L662 305 L640 320 L620 306 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M1000 330 L1040 260 L1088 330 L1060 314 L1040 330 L1018 314 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M1340 350 L1380 280 L1424 350 L1400 336 L1380 350 L1360 336 Z" fill="#FFFFFF" opacity="0.85"/>

  <!-- near ridge -->
  <path d="M0 520 L260 430 L520 520 L820 420 L1120 520 L1380 440 L1600 520 L1600 560 L0 560 Z" fill="#4B2882"/>

  <!-- lake -->
  <rect y="520" width="1600" height="380" fill="url(#lake)"/>
  <!-- lake reflections / shoreline -->
  <path d="M0 540 L1600 540 L1600 556 L0 556 Z" fill="#FFFFFF" opacity="0.18"/>
  <path d="M0 620 L1600 620 L1600 632 L0 632 Z" fill="#FFFFFF" opacity="0.10"/>

  <!-- shoreline trees: pines + golden larches -->
  <g>
    <polygon points="70,520 96,470 122,520" fill="#0F6E56"/>
    <polygon points="110,520 132,478 154,520" fill="#0F6E56"/>
    <polygon points="150,520 176,462 202,520" fill="#146E4A"/>
    <polygon points="196,520 216,484 236,520" fill="#E9C400"/>
    <polygon points="232,520 258,468 284,520" fill="#0F6E56"/>
    <polygon points="1360,520 1386,468 1412,520" fill="#0F6E56"/>
    <polygon points="1404,520 1424,482 1444,520" fill="#E9C400"/>
    <polygon points="1440,520 1466,466 1492,520" fill="#146E4A"/>
    <polygon points="1486,520 1508,478 1530,520" fill="#0F6E56"/>
    <polygon points="1524,520 1550,470 1576,520" fill="#E9C400"/>
  </g>
</svg>
